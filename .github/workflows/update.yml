name: Daily Update

on:
  schedule:
    - cron: '0 2 * * *'   # 每天 UTC 02:00 = 北京 10:00
  workflow_dispatch:       # 手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 安装 puppeteer（含 chromium，供热度抓取）
      - name: Install deps
        run: |
          npm install puppeteer --no-fund --no-audit
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      # 1. 抓模型列表（API）
      - name: Fetch models
        run: python fetch_models.py

      # 2. 抓热度榜（Puppeteer 渲染）
      - name: Fetch hot ranking
        run: node fetch_hot.js

      # 3. 生成静态站
      - name: Build site
        run: python build_site.py

      # 4. 提交更新
      - name: Commit and push
        run: |
          git config user.name "kawaiies"
          git config user.email "buyfme@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "每日更新 $(date -u +%Y-%m-%d)"
            git push
          else
            echo "无数据变化，跳过提交"
          fi
